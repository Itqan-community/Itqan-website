name: Auto-Sync Itqan Resources

on:
  schedule:
    # Run every day at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Resource Scanner (with Multi-Tier Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python sync_resources.py

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync resources from Itqan Community" && git push)
